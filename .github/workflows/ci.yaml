name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: threeal/setup-pnpm-action@v2.0.0

      - name: Install dependencies
        run: pnpm install

      - name: Check types
        run: pnpm tsc

      - name: Test
        run: pnpm vitest run

      - name: Check formatting
        run: pnpm prettier --check .

      - name: Check lint
        run: pnpm eslint

      - name: Build
        run: pnpm vite build
